# Docker Compose for Legal Practice CRM + ERP Platform

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: metadata-erp-postgres
    environment:
      POSTGRES_DB: metadata_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  # Redis Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: metadata-erp-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  # Auth Service
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: metadata-erp-auth
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:@postgres:5432/metadata_erp
      - CREATE_TABLES_ON_STARTUP=true
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=30
      - SECRET_KEY=
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - PORT=8001
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:3001","http://localhost:8001","http://localhost:3006"]
      - DEFAULT_SESSION_TIMEOUT_MINUTES=480
      - MAX_CONCURRENT_SESSIONS=5
      - MAX_LOGIN_ATTEMPTS=5
      - ACCOUNT_LOCKOUT_DURATION_MINUTES=15
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/auth:/app
      - auth_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - erp-network
    # restart: unless-stopped  # Disabled for manual control

  # API Service
  api-service:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: metadata-erp-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:@postgres:5432/metadata_erp
      - TENANT_DB_TEMPLATE=postgresql+asyncpg://postgres:@postgres:5432/metadata_erp_tenant_{tenant_id}
      - REDIS_URL=redis://redis:6379/1
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - PORT=8000
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:3001","http://localhost:8001","http://localhost:3006"]
      - UPLOAD_DIR=./uploads
      - MAX_FILE_SIZE=10485760
      - AUTO_SEED_ON_STARTUP=false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    volumes:
      - ./services/api:/app
      - ./data:/app/data
      - api_uploads:/app/uploads
      - api_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - erp-network
    # restart: unless-stopped  # Disabled for manual control

  # Frontend apps removed from Docker - run locally for faster development
  # Use: npm run dev:legal and npm run dev:client

volumes:
  postgres_data:
    name: metadata-erp-postgres-data
  redis_data:
    name: metadata-erp-redis-data
  auth_cache:
    name: metadata-erp-auth-cache
  api_cache:
    name: metadata-erp-api-cache
  api_uploads:
    name: metadata-erp-api-uploads
  # Frontend volumes removed (apps run locally)

networks:
  erp-network:
    name: metadata-erp-network
    driver: bridge
