# Docker Compose for Legal Practice CRM + ERP Platform
version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: metadata-erp-postgres
    environment:
      POSTGRES_DB: metadata_erp_master
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  # Redis Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: metadata-erp-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  # Auth Service
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: metadata-erp-auth
    environment:
      - DATABASE_URL=postgresql://erp_user:@postgres:5432/metadata_erp_master
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=
      - SECRET_KEY=
      - ENVIRONMENT=development
      - DEBUG=true
      - PORT=8001
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:3001"]
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/auth:/app
      - auth_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - erp-network
    restart: unless-stopped

  # API Service
  api-service:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: metadata-erp-api
    environment:
      - DATABASE_URL=postgresql://erp_user:@postgres:5432/metadata_erp_master
      - TENANT_DB_TEMPLATE=postgresql://erp_user:@postgres:5432/metadata_erp_tenant_{tenant_id}
      - REDIS_URL=redis://redis:6379/1
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ENVIRONMENT=development
      - DEBUG=true
      - PORT=8000
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:3001"]
      - UPLOAD_DIR=./uploads
      - MAX_FILE_SIZE=10485760
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    volumes:
      - ./services/api:/app
      - ./data:/app/data
      - api_uploads:/app/uploads
      - api_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - erp-network
    restart: unless-stopped

  # Frontend Client
  client:
    build:
      context: .
      dockerfile: ./apps/client/Dockerfile
    container_name: metadata-erp-client
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_AUTH_URL=http://localhost:8001
      - NODE_ENV=development
      - NEXT_PUBLIC_ENV=development
      - NEXT_PUBLIC_DEFAULT_TENANT_ID=demo-eshop-crm
    ports:
      - "3000:3000"
    depends_on:
      api-service:
        condition: service_healthy
    volumes:
      - ./apps/client:/app/apps/client
      - ./packages:/app/packages
      - ./data:/app/data
      - node_modules:/app/node_modules
      - next_cache:/app/apps/client/.next
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - erp-network
    restart: unless-stopped

volumes:
  postgres_data:
    name: metadata-erp-postgres-data
  redis_data:
    name: metadata-erp-redis-data
  auth_cache:
    name: metadata-erp-auth-cache
  api_cache:
    name: metadata-erp-api-cache
  api_uploads:
    name: metadata-erp-api-uploads
  node_modules:
    name: metadata-erp-node-modules
  next_cache:
    name: metadata-erp-next-cache

networks:
  erp-network:
    name: metadata-erp-network
    driver: bridge
