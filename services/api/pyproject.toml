[tool.poetry]
name = "metadata-erp-api"
version = "1.0.0"
description = "Core API service for metadata-driven CRM+ERP"
authors = ["Alkas Software <info@alkassoftware.com>"]
license = "MIT"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.12.0"
pydantic = {extras = ["email"], version = "^2.5.0"}
pydantic-settings = "^2.1.0"
redis = "^5.0.0"
httpx = "^0.25.0"
structlog = "^23.2.0"
tenacity = "^8.2.0"
bcrypt = "^4.1.0"
pyjwt = "^2.8.0"
pyotp = "^2.9.0"
email-validator = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
httpx = "^0.25.0"
faker = "^20.1.0"
factory-boy = "^3.3.0"
black = "^23.9.1"
ruff = "^0.1.0"
mypy = "^1.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 88
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ['py311'] 